<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->

    <title>Payoo | Log In</title>

    <!-- Favicon -->

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- DaisyUi CDN -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind CDN -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS -->

    <style>
        * {
            font-family: "Outfit", sans-serif;

        }

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto pt-3">
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-50">
        <section class="w-11/12 mx-auto py-3 flex justify-between">
            <div class="left flex gap-1">
                <div class="w-[60px]">
                    <img src="./assets/logo.png" alt="Payoo-logo">
                </div>
                <div class="balance-info">
                    <h2 class="font-2xl font-bold">
                        $
                        <span id="balance-amount" class="balance">
                            45000
                        </span>
                    </h2>
                    <p class="text-neutral/50">
                        Available Balance
                    </p>
                </div>
            </div>
            <div class="right">
                <a href="./index.html" class="btn btn-soft">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-rotate-180"></i>
                    Log Out
                </a>
            </div>
        </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="text-3xl font-bold">
            Welcome to Pay<span class="text-primary">oo</span>
        </h2>
        <p class="text-neutral/50">
            Enjoy easy and convenient financial services with us. Cash out charge is low and
        </p>

        <div class="buttons grid grid-cols-3 gap-5">
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-1.png" alt="Add Money logo">
                <p>Add Money</p>
            </button>
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-2.png" alt="Cash Out logo">
                <p>Cash Out</p>
            </button>
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-3.png" alt="Transfer Money logo">
                <p>Transfer Money</p>
            </button>
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-4.png" alt="Get Bonus logo">
                <p>Get Bonus</p>
            </button>
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-5.png" alt="Pay Bill logo">
                <p>Pay Bill</p>
            </button>
            <button class="btn feature-btn flex-col h-full py-4 btn-primary btn-soft rounded">
                <img src="./assets/opt-6.png" alt="Transactions logo">
                <p>Transactions</p>
            </button>
        </div>
    </section>

    <section class="form w-11/12 mx-auto py-5 space-y-5">
        <section id="latest-form" class="w-11/12 mx-auto">
            <h1 class="text-xl font-bold mb-3">Latest Payment</h1>
            <div class="space-y-5">
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Electricity Bill</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Bank Deposit</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Mobile Recharge</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Gas Bill</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>

            </div>

        </section>
    </section>

    <section class="w-11/12 mx-auto py-10 space-y-5 hidden">
        <section id="addmoney-form" class="form w-11/12 mx-auto py-5">
            <h1 class="text-xl font-bold">Add Money</h1>

            <div class="log-in-form pt-5">
                <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-xl rounded-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label text-neutral font-bold">Select A Bank</label>
                            <select id="bank" class="select input rounded-full bg-base-200">
                                <option disabled selected>Select a Bank</option>
                                <option value="IBBL">IBBL</option>
                                <option value="DBBL">DBBL</option>
                                <option value="BRAC">BRAC</option>
                            </select>
                            <br>
                            <label class="label text-neutral font-bold">Bank Account Number</label>
                            <input id="acc-number" maxlength="17" type="tel" inputmode="numeric" pattern="[0-9]{17}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter 17 Digit Account Number" />
                            <br>
                            <label class="label text-neutral font-bold">Amount to Add</label>
                            <input id="addmoney-amount" type="tel" inputmode="numeric" pattern="[0-9]"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter Amount To Add" />
                            <br>
                            <label class="label text-neutral font-bold">Pin Number</label>
                            <input id="addmoney-pin" maxlength="4" pattern="[0-9]{4}"
                                oninput="this.value=this.value.replace(/[^0-9]/g, '')" type="password"
                                inputmode="numeric" required class="input rounded-full bg-base-200"
                                placeholder="Enter 4 Digit Pin" />
                            <button id="addmoney-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section class="form w-11/12 mx-auto py-5 space-y-5 hidden">
        <section id="cashout-form" class="w-11/12 mx-auto">
            <h1 class="text-xl font-bold">Cash Out</h1>

            <div class="log-in-form pt-5">
                <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-xl rounded-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label text-neutral font-bold">Agent Number</label>
                            <input id="agent-number" maxlength="11" type="tel" inputmode="numeric" pattern="[0-9]{11}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter 11 Digit Number" />
                            <br>
                            <label class="label text-neutral font-bold">Amount</label>
                            <input id="cash-out-amount" type="tel" inputmode="numeric" pattern="[0-9]"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter amount to withdraw" />
                            <br>
                            <label class="label text-neutral font-bold">Pin Number</label>
                            <input id="cash-out-pin" maxlength="4" pattern="[0-9]{4}"
                                oninput="this.value=this.value.replace(/[^0-9]/g, '')" type="password"
                                inputmode="numeric" required class="input rounded-full bg-base-200"
                                placeholder="Enter 4 Digit Pin" />
                            <button id="cash-out-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section class="form w-11/12 mx-auto py-5 space-y-5 hidden">
        <section id="transfer-money-form" class="w-11/12 mx-auto">
            <h1 class="text-xl font-bold">Transfer Money</h1>

            <div class="log-in-form pt-5">
                <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-xl rounded-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label text-neutral font-bold">User Account Number</label>
                            <input id="user-account-number" maxlength="11" type="tel" inputmode="numeric"
                                pattern="[0-9]{11}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter 11 Digit Number" />
                            <br>
                            <label class="label text-neutral font-bold">Amount</label>
                            <input id="transfer-amount" type="tel" inputmode="numeric" pattern="[0-9]"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter amount to withdraw" />
                            <br>
                            <label class="label text-neutral font-bold">Pin Number</label>
                            <input id="transfer-pin" maxlength="4" pattern="[0-9]{4}"
                                oninput="this.value=this.value.replace(/[^0-9]/g, '')" type="password"
                                inputmode="numeric" required class="input rounded-full bg-base-200"
                                placeholder="Enter 4 Digit Pin" />
                            <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full">
                                Send Now
                            </button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section class="form w-11/12 mx-auto py-5 space-y-5 hidden">
        <section id="get-bonus-form" class="w-11/12 mx-auto">
            <h1 class="text-xl font-bold">Get Bonus</h1>

            <div class="log-in-form pt-5">
                <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-xl rounded-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label text-neutral font-bold">Enter Bonus Coupon</label>
                            <input id="cupon-code" maxlength="6" maxlength="6" type="text" required
                                class="input rounded-full bg-base-200 uppercase" placeholder="Enter your coupon" />
                            <button id="get-bonus-btn" class="btn btn-primary mt-4 rounded-full">
                                Get Bonus
                            </button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section class="w-11/12 mx-auto py-10 space-y-5 hidden">
        <section id="pay-bill-form" class="form w-11/12 mx-auto py-5">
            <h1 class="text-xl font-bold">Pay Bill</h1>

            <div class="pay-bill-form pt-5">
                <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-xl rounded-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label text-neutral font-bold">Select To Pay</label>
                            <select id="pay" class="select input rounded-full bg-base-200">
                                <option disabled selected>Select a Bank</option>
                                <option value="GAS">GAS</option>
                                <option value="ELECTRICITY">ELECTRICITY</option>
                                <option value="WIFI">WIFI</option>
                            </select>
                            <br>
                            <label class="label text-neutral font-bold">Biller Account Number</label>
                            <input id="acc-number" maxlength="17" type="tel" inputmode="numeric" pattern="[0-9]{17}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                                class="input rounded-full bg-base-200" placeholder="Enter 17 Digit Account Number" />

                            <br>
                            <label class="label text-neutral font-bold">Pin Number</label>
                            <input id="pay-bill-pin" maxlength="4" pattern="[0-9]{4}"
                                oninput="this.value=this.value.replace(/[^0-9]/g, '')" type="password"
                                inputmode="numeric" required class="input rounded-full bg-base-200"
                                placeholder="Enter 4 Digit Pin" />
                            <button id="pay-bill-btn" class="btn btn-primary mt-4 rounded-full">Pay Now</button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section class="form w-11/12 mx-auto py-5 space-y-5 hidden">
        <section id="transaction-form" class="w-11/12 mx-auto">
            <h1 class="text-xl font-bold mb-3">Transaction History</h1>
            <div class="space-y-5">
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Electricity Bill</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Bank Deposit</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Mobile Recharge</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>
                <button
                    class="btn btn-primary btn-ghost w-full justify-start h-auto p-4 rounded-xl bg-base-100 shadow-sm hover:bg-base-200">

                    <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center relative">
                        <img src="./assets/opt-1.png" alt="option-1" class="w-7 h-7">
                    </div>

                    <div class="text-left flex-1">
                        <h2 class="font-bold text-gray-700">Gas Bill</h2>
                        <p class="text-sm text-gray-500">Today 01:44 AM</p>
                    </div>

                </button>

            </div>

        </section>
    </section>


    <script src="./script/machine.js"></script>
    <script src="./script/addmoney.js"></script>
    <script src="./script/cashout.js"></script>
</body>

</html>
