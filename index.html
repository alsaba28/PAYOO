<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->

    <title>Payoo | Log In</title>

    <!-- Favicon -->

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- DaisyUi CDN -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind CDN -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS -->

    <style>
        * {
            font-family: "Outfit", sans-serif;

        }
    </style>


</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <section id="log-in">
        <div class="logo-img w-[200px] mx-auto pt-32">
            <img src="./assets/Logo-full.png" alt="Payoo-logo">
        </div>
        <div class="log-in-form pt-10">
            <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 shadow-2xl rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">Mobile Number</label>
                        <input id="phone-number" maxlength="11" type="tel" inputmode="numeric" pattern="[0-9]{11}"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                            class="input rounded-full bg-base-200" placeholder="Enter Your Number" />
                        <br>
                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="input-pin" maxlength="4" pattern="[0-9]{4}" oninput="this.value=this.value.replace(/[^0-9]/g, '')"
                            type="password" inputmode="numeric" required class="input rounded-full bg-base-200"
                            placeholder="Enter 4 Digit Pin" />
                        <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <script src="./script/login.js"></script>
</body>

</html>
